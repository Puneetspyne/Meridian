name: Bug report
description: Something is wrong, missing or inaccurate in Meridian
labels: [bug]
body:
  - type: input
    id: chip
    attributes:
      label: Chip
      description: For example M1, M2 Pro, M3 Max, M4.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Output of `sw_vers -productVersion`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Meridian version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: snapshot
    attributes:
      label: meridianctl snapshot
      description: Paste the output of `meridianctl snapshot` (inside Meridian.app/Contents/MacOS/). It contains no personal data beyond the hostname-free hardware readings; review it before posting.
      render: json
    validations:
      required: true
